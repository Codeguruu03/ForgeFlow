# Server Configuration
server.port=8080

# Spring Application
spring.application.name=ForgeFlow

# Database Configuration (H2 in-memory/file mode with PostgreSQL compatibility)
spring.datasource.url=jdbc:h2:mem:forgeflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration (for debugging/inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security JWT Config
forgeflow.jwt.secret=9a2f8c4e1b7d5a3f6c8e0b2d4f6a8c1e3b5d7f9a1c3e5b7d9f2a4c6e8b0d2f4a
forgeflow.jwt.expiration-ms=86400000

# File Upload / LocalSync Config
forgeflow.sync.base-dir=./sync_data
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
